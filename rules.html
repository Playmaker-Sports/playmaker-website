<body>

    <main class="page-shell">
      <a class="back-link" id="back-link" href="#">&larr; Back to event</a>

      <section class="section">
        <div class="event-info-card rules-content" id="rules-container">

  <script src="site.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      var slug = getParam("slug");
      if (!slug) { document.getElementById("rules-container").innerHTML = '<div class="data-empty">No event specified.</div>'; return; }

      document.getElementById("back-link").href = slug + ".html";

      try {
        var config = await fetchConfig();
        var ev = getEventBySlug(config, slug);
        if (!ev) { document.getElementById("rules-container").innerHTML = '<div class="data-empty">Event not found.</div>'; return; }

        document.title = ev.eventName + " — Tournament Rules | Playmaker Sports";

        // Fetch rules template
        var template;
        try {
          var res = await fetch(staticUrl("/rules_template.json"));
          if (res.ok) template = await res.json();
        } catch (e) {}
        if (!template) {
          var res2 = await fetch("rules_template.json");
          if (res2.ok) template = await res2.json();
        }
        if (!template) {
          document.getElementById("rules-container").innerHTML = '<div class="data-empty">Could not load rules template.</div>';
          return;
        }

        var eventRules = ev.rules || {};
        renderRules(template, ev.eventName, eventRules);
      } catch (err) {
        document.getElementById("rules-container").innerHTML = '<div class="data-empty" style="color:var(--danger);">Failed to load rules: ' + err.message + '</div>';
      }
    });

    function renderRules(template, eventName, eventRules) {
      var container = document.getElementById("rules-container");
      var html = "";

      template.sections.forEach(function (s) {
        var text = s.text || "";
        // Replace {eventName} placeholder
        text = text.replace(/\{eventName\}/g, eventName);

        switch (s.type) {
          case "header":
            html += '<h1 class="rules-header">' + text + '</h1>';
            break;

          case "sectionHeader":
            // Replace {refundHeader}
            text = text.replace(/\{refundHeader\}/g, eventRules.refundHeader || "Refund Policy:");
            html += '<h2 class="rules-section-header">' + text + '</h2>';
            break;

          case "subHeader":
            html += '<h3 class="rules-sub-header">' + text + '</h3>';
            break;

          case "text":
            if (s.key) {
              // Render from eventRules by key
              var val = eventRules[s.key];
              if (val) html += '<p class="rules-text">' + val + '</p>';
            } else {
              html += '<p class="rules-text">' + text + '</p>';
            }
            break;

          case "italic":
            html += '<p class="rules-italic">' + text + '</p>';
            break;

          case "listItem":
            html += '<div class="rules-list-item">' + text + '</div>';
            break;

          case "list":
            // Render array from eventRules
            if (s.key && eventRules[s.key] && Array.isArray(eventRules[s.key])) {
              eventRules[s.key].forEach(function (line) {
                if (line.startsWith("*")) {
                  html += '<p class="rules-italic">' + line + '</p>';
                } else {
                  html += '<p class="rules-text">' + line + '</p>';
                }
              });
            }
            break;

          case "styledList":
            if (s.key && eventRules[s.key] && Array.isArray(eventRules[s.key])) {
              eventRules[s.key].forEach(function (line) {
                if (line.startsWith("*")) {
                  html += '<p class="rules-italic">' + line + '</p>';
                } else {
                  html += '<p class="rules-text">' + line + '</p>';
                }
              });
            }
            break;

          case "table":
            html += '<table class="rules-table"><thead><tr>';
            (s.headers || []).forEach(function (h) {
              html += '<th>' + h.replace(/\n/g, '<br>') + '</th>';
            });
            html += '</tr></thead><tbody>';
            (s.rows || []).forEach(function (row) {
              html += '<tr>';
              row.forEach(function (cell) { html += '<td>' + cell + '</td>'; });
              html += '</tr>';
            });
            html += '</tbody></table>';
            break;
        }
      });

      container.innerHTML = html;
    }
  </script>
</body>
</html>
