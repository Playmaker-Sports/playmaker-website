<main class="event-page-shell">
  <section class="event-hero-banner">
    <img class="event-hero-bg" src="{{eventPage.heroImage}}" alt="{{eventPage.heroAlt}}" />
    <div class="event-hero-overlay">
      <div class="event-hero-info">
        <div class="event-hero-kicker">Playmaker Sports Tournament</div>
        <h1 class="hero-simple-title">{{eventPage.title}}</h1>
        <p class="hero-simple-subtext">Loading...</p>
        <div class="hero-buttons"></div>
        <nav class="event-nav" id="event-nav"></nav>
      </div>
    </div>
  </section>

  <div class="event-page-content">
    <section class="section event-details-section">
      <div class="event-info-card event-details-rail">
        <div class="event-info-intro">
          <div class="event-info-identity">
            <img class="event-info-logo" src="" alt="" />
            <div class="event-countdown" hidden></div>
          </div>
          <div class="event-section-kicker">Tournament information</div>
          <h2 class="event-info-title">{{eventPage.detailsHeading}}</h2>
        </div>
        <div class="event-info-grid">
          <div class="event-info-row">
            <span class="info-label">{{eventPage.locationLabel}}</span>
            <span>Loading...</span>
          </div>
          <div class="event-info-row">
            <span class="info-label">{{eventPage.datesLabel}}</span>
            <span>Loading...</span>
          </div>
          <div class="event-info-row">
            <span class="info-label">{{eventPage.ageGroupsLabel}}</span>
            <span>{{eventPage.ageGroupsText}}</span>
          </div>
        </div>
      </div>
    </section>

    <section class="section" id="field-map">
      <div class="fieldmap-card">
        <h2 class="section-title">{{eventPage.fieldMapHeading}}</h2>
        <img class="fieldmap-img" src="" alt="{{eventPage.fieldMapAlt}}" />
      </div>
    </section>
  </div>
</main>
