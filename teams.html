<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Teams | Playmaker Sports</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="site-wrapper">
    <header class="nav-shell">
      <div class="nav-inner">
        <div class="nav-left">
          <div class="nav-logo-img"><img src="logo.png" alt="Playmaker Sports Logo" /></div>
          <div class="nav-title"><span>Playmaker Sports</span></div>
        </div>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="playmakers-cup.html">Playmakers Cup</a>
          <a href="winter-fest.html">Winter Fest</a>
          <a href="summer-championship.html">Summer Championship</a>
          <a href="news.html">News</a>
          <a href="contact.html">Contact Us</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <a class="back-link" id="back-link" href="#">&larr; Back to event</a>

      <section class="page-header">
        <div class="page-kicker" id="page-kicker">Teams</div>
        <h1 class="page-title" id="page-title">Loading...</h1>
        <p class="page-lead" id="page-lead"></p>
      </section>

      <!-- Team detail view -->
      <section id="team-detail-view" style="display:none;">
        <div class="team-detail-header" id="team-header"></div>
        <div id="team-record"></div>

        <div class="event-info-card" style="margin-bottom:20px;">
          <h2 class="event-info-title">Bracket Standings</h2>
          <div id="team-standings-container"></div>
        </div>

        <div class="event-info-card">
          <h2 class="event-info-title">Matches</h2>
          <div class="matches-list" id="team-matches-container"></div>
        </div>
      </section>

      <!-- Teams list view -->
      <section id="teams-list-view">
        <div class="filter-bar">
          <input type="text" id="teams-search" placeholder="Search teams..." />
          <select id="teams-age-filter">
            <option value="">All Age Groups</option>
          </select>
        </div>
        <div class="teams-grid" id="teams-grid">
          <div class="data-loading">Loading teams...</div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-links">
          <a href="contact.html">Contact Us</a><span>•</span>
          <a href="mailto:info@playmakersports.us">info@playmakersports.us</a><span>•</span>
          <a href="contact.html">Sponsor an Event</a>
        </div>
        <div class="footer-socials">
          <a href="https://www.instagram.com/playmaker_sports_" target="_blank" rel="noopener" class="social-btn social-instagram">Instagram</a>
          <a href="https://www.facebook.com/people/Playmaker-Sports/61578334102618/" target="_blank" rel="noopener" class="social-btn social-facebook">Facebook</a>
          <a href="https://www.youtube.com/@Playmaker-Sports" target="_blank" rel="noopener" class="social-btn social-youtube">YouTube</a>
          <a href="https://x.com/PlaymakrSports?s=20" target="_blank" rel="noopener" class="social-btn social-twitter">X</a>
        </div>
      </div>
    </footer>
  </div>

  <script src="site.js"></script>
  <script>
    var _allTeams = [];
    var _allMatches = [];
    var _allStandings = {};
    var _slug = "";

    document.addEventListener("DOMContentLoaded", async function () {
      _slug = getParam("slug");
      var teamId = getParam("team");
      if (!_slug) { document.getElementById("page-title").textContent = "No event specified"; return; }

      document.getElementById("back-link").href = _slug + ".html";

      try {
        var config = await fetchConfig();
        var ev = getEventBySlug(config, _slug);
        if (!ev) { document.getElementById("page-title").textContent = "Event not found"; return; }

        document.getElementById("page-title").textContent = ev.eventName + " — Teams";
        document.title = "Teams — " + ev.eventName + " | Playmaker Sports";

        if (ev.scheduleDisabled && !ev.archived) {
          document.getElementById("teams-grid").innerHTML = '<div class="data-empty">Team data will be available closer to the event.</div>';
          return;
        }

        var data = await fetchEventData(ev);
        _allTeams = extractTeams(data);
        _allTeams.sort(function (a, b) { return a.name.localeCompare(b.name); });
        _allMatches = data.matches || data.games || [];
        _allStandings = data.standings || {};

        // Build age filter
        var ages = [...new Set(_allTeams.map(function (t) { return t.age; }).filter(Boolean))].sort(function (a, b) {
          return (parseInt(a.replace(/\D/g, "")) || 0) - (parseInt(b.replace(/\D/g, "")) || 0);
        });
        var ageSelect = document.getElementById("teams-age-filter");
        ages.forEach(function (ag) {
          var opt = document.createElement("option");
          opt.value = ag; opt.textContent = ag;
          ageSelect.appendChild(opt);
        });

        if (teamId) {
          showTeamDetail(teamId);
        } else {
          renderTeamsList(_allTeams);
        }
      } catch (err) {
        document.getElementById("teams-grid").innerHTML = '<div class="data-empty" style="color:var(--danger);">Failed to load teams: ' + err.message + '</div>';
      }
    });

    document.getElementById("teams-search").addEventListener("input", applyFilters);
    document.getElementById("teams-age-filter").addEventListener("change", applyFilters);

    function applyFilters() {
      var q = document.getElementById("teams-search").value.toLowerCase();
      var age = document.getElementById("teams-age-filter").value;
      var filtered = _allTeams.filter(function (t) {
        if (age && t.age !== age) return false;
        if (q && !t.name.toLowerCase().includes(q) && !(t.club || "").toLowerCase().includes(q)) return false;
        return true;
      });
      renderTeamsList(filtered);
    }

    function renderTeamsList(teams) {
      var grid = document.getElementById("teams-grid");
      document.getElementById("page-lead").textContent = teams.length + " teams";

      if (!teams.length) { grid.innerHTML = '<div class="data-empty">No teams found.</div>'; return; }

      grid.innerHTML = teams.map(function (t) {
        return '<div class="team-card">' +
          '<a href="teams.html?slug=' + _slug + '&team=' + t.id + '">' +
            '<div class="team-logo">' +
              (t.logoUrl ? '<img src="' + t.logoUrl + '" alt="" loading="lazy" />' : '') +
            '</div>' +
            '<div class="team-info">' +
              '<div class="team-name">' + t.name + '</div>' +
              '<div class="team-club">' + (t.club || '') + '</div>' +
              '<div class="team-age">' + [t.gender, t.age, t.bracket].filter(Boolean).join(" \u2022 ") + '</div>' +
              '<div class="team-stats">' + (t.mp || 0) + 'MP \u2022 ' + (t.w || 0) + 'W-' + (t.l || 0) + 'L-' + (t.d || 0) + 'D \u2022 ' + (t.pts || 0) + ' pts</div>' +
            '</div>' +
          '</a>' +
        '</div>';
      }).join("");
    }

    function showTeamDetail(teamId) {
      var team = _allTeams.find(function (t) { return t.id === teamId; });
      if (!team) { document.getElementById("page-title").textContent = "Team not found"; return; }

      document.getElementById("teams-list-view").style.display = "none";
      document.getElementById("team-detail-view").style.display = "";
      document.getElementById("page-title").textContent = team.name;
      document.getElementById("page-kicker").textContent = "Team Details";
      document.getElementById("page-lead").textContent = "";
      document.getElementById("back-link").href = "teams.html?slug=" + _slug;
      document.getElementById("back-link").innerHTML = "&larr; Back to teams";

      // Header
      document.getElementById("team-header").innerHTML =
        '<div class="team-detail-logo">' +
          (team.logoUrl ? '<img src="' + team.logoUrl + '" alt="" />' : '') +
        '</div>' +
        '<div>' +
          '<div class="team-detail-name">' + team.name + '</div>' +
          '<div class="team-detail-meta">' + [team.club, team.gender, team.age, team.bracket].filter(Boolean).join(" \u2022 ") + '</div>' +
        '</div>';

      // Record
      document.getElementById("team-record").innerHTML =
        '<div class="record-box">' +
          '<div class="record-stat"><div class="record-stat-value">' + (team.w || 0) + '</div><div class="record-stat-label">Wins</div></div>' +
          '<div class="record-stat"><div class="record-stat-value">' + (team.l || 0) + '</div><div class="record-stat-label">Losses</div></div>' +
          '<div class="record-stat"><div class="record-stat-value">' + (team.d || 0) + '</div><div class="record-stat-label">Draws</div></div>' +
          '<div class="record-stat"><div class="record-stat-value">' + (team.pts || 0) + '</div><div class="record-stat-label">Points</div></div>' +
          '<div class="record-stat"><div class="record-stat-value">' + (team.gf || 0) + '-' + (team.ga || 0) + '</div><div class="record-stat-label">GF-GA</div></div>' +
        '</div>';

      // Bracket standings
      renderTeamStandings(team);

      // Matches
      renderTeamMatches(team);
    }

    function renderTeamStandings(team) {
      var container = document.getElementById("team-standings-container");
      // Find the bracket this team is in
      var bracketTeams = [];

      if (typeof _allStandings === "object" && !Array.isArray(_allStandings)) {
        // Object keyed format — find the bracket containing this team
        for (var key in _allStandings) {
          var arr = _allStandings[key];
          if (Array.isArray(arr)) {
            var found = arr.find(function (t) { return t.id === team.id || t.name === team.name; });
            if (found) { bracketTeams = arr; break; }
          }
        }
      }

      if (!bracketTeams.length) {
        // Try building from all teams with same bracket
        bracketTeams = _allTeams.filter(function (t) { return t.bracket === team.bracket && t.age === team.age && t.gender === team.gender; });
        bracketTeams.sort(function (a, b) { return (b.pts || 0) - (a.pts || 0); });
      }

      if (!bracketTeams.length) {
        container.innerHTML = '<div class="data-empty">No bracket standings available.</div>';
        return;
      }

      var table = '<table class="standings-table"><thead><tr>' +
        '<th>#</th><th>Team</th><th>GP</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th>' +
        '</tr></thead><tbody>';

      bracketTeams.forEach(function (t, i) {
        var isThis = (t.id === team.id || t.name === team.name);
        var style = isThis ? ' style="background:var(--accent-soft);"' : '';
        table += '<tr' + style + '>' +
          '<td>' + (i + 1) + '</td>' +
          '<td>' + (t.name || "") + '</td>' +
          '<td>' + (t.mp ?? "") + '</td><td>' + (t.w ?? "") + '</td><td>' + (t.d ?? "") + '</td><td>' + (t.l ?? "") + '</td>' +
          '<td>' + (t.gf ?? "") + '</td><td>' + (t.ga ?? "") + '</td><td>' + (t.gd ?? "") + '</td><td>' + (t.pts ?? "") + '</td>' +
          '</tr>';
      });

      table += '</tbody></table>';
      container.innerHTML = table;
    }

    function renderTeamMatches(team) {
      var container = document.getElementById("team-matches-container");
      var teamName = team.name.toLowerCase();

      var matches = _allMatches.filter(function (m) {
        var home = (m.homeTeam || m.home_team_name || m.home_team || m.home || "").toLowerCase();
        var away = (m.awayTeam || m.away_team_name || m.away_team || m.away || "").toLowerCase();
        return home.includes(teamName) || away.includes(teamName) || teamName.includes(home) || teamName.includes(away);
      });

      if (!matches.length) {
        container.innerHTML = '<div class="data-empty">No matches found for this team.</div>';
        return;
      }

      container.innerHTML = matches.map(function (m) {
        var home = m.homeTeam || m.home_team_name || m.home_team || m.home || "";
        var away = m.awayTeam || m.away_team_name || m.away_team || m.away || "";
        var hasScore = m.homeScore != null && m.awayScore != null;
        var scoreText = hasScore ? m.homeScore + " - " + m.awayScore : "vs";
        var time = m.time || m.match_time || "";
        var field = m.location || m.field || "";
        var stage = m.stage || m.type || "";

        return '<div class="match-card">' +
          '<div class="match-team">' +
            '<div class="match-team-name">' + home + '</div>' +
          '</div>' +
          '<div class="match-center">' +
            '<div class="match-score' + (hasScore ? ' score-final' : '') + '">' + scoreText + '</div>' +
            (stage ? '<div class="match-time">' + stage + '</div>' : '') +
          '</div>' +
          '<div class="match-team match-team-away">' +
            '<div class="match-team-name">' + away + '</div>' +
          '</div>' +
          '<div style="grid-column:1/-1;" class="match-meta">' + time + (field ? ' \u2022 ' + field : '') + '</div>' +
        '</div>';
      }).join("");
    }
  </script>
</body>
</html>
