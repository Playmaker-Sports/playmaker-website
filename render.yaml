services:
  - type: web
    name: playmaker-website
    runtime: static
    branch: main
    autoDeployTrigger: commit
    domains:
      - www.playmakersports.us
    buildCommand: cp -R dist render-dist
    staticPublishPath: ./render-dist
    routes:
      - type: redirect
        source: /contactus
        destination: /contact.html
      - type: redirect
        source: /playmakerscup
        destination: /playmakers-cup.html
      - type: redirect
        source: /winterfest
        destination: /winter-fest.html
      - type: redirect
        source: /summerchampionship
        destination: /summer-championship.html
      - type: redirect
        source: /news
        destination: /news.html
      - type: redirect
        source: /partners
        destination: /partners.html
      - type: redirect
        source: /post/winter-fest-2026-debuts-new-winter-themed-tournament-experience
        destination: /post-winter-fest-2026-debuts-new-winter-themed-tournament-experience.html
      - type: redirect
        source: /post/playmakers-cup-delivers-a-milestone-weekend-in-moorpark-with-new-innovations
        destination: /post-playmakers-cup-delivers-a-milestone-weekend-in-moorpark-with-new-innovations.html
      - type: redirect
        source: /post/playmaker-sports-summer-championship-heats-up-moorpark
        destination: /post-playmaker-sports-summer-championship-heats-up-moorpark.html
      - type: redirect
        source: /post/winter-fest-2025-recap
        destination: /post-winter-fest-2025-recap.html
      - type: redirect
        source: /post/playmakers-cup-moorpark-recap
        destination: /post-playmakers-cup-moorpark-recap.html
      - type: redirect
        source: /post/the-playmakers-cup-is-back
        destination: /post-the-playmakers-cup-is-back.html
      - type: redirect
        source: /post/recap-of-the-first-ever-playmakers-cup
        destination: /post-recap-of-the-first-ever-playmakers-cup.html
      - type: redirect
        source: /post/*
        destination: /news.html
      - type: redirect
        source: /privacy-policy
        destination: https://playmaker-static.onrender.com/privacy-policy.html
    headers:
      - path: /*.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /data/*
        name: Cache-Control
        value: public, max-age=300
      - path: /event_config.json
        name: Cache-Control
        value: public, max-age=300
      - path: /archived/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
